<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="พรรคสังคมใหม่ - New Society Party">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://newsocietyparty.vercel.app/">
    <meta property="og:image" content="https://newsocietyparty.vercel.app/assets/thumbnail.png">
    <meta property="og:site_name" content="พรรคสังคมใหม่ - New Society Party">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="พรรคสังคมใหม่ - New Society Party">
    <meta name="twitter:image" content="https://newsocietyparty.vercel.app/assets/thumbnail.png">

    <title>พรรคสังคมใหม่ - New Society Party</title>

    <link rel="shortcut icon" href="assets/favicon.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #01ff00;
            color: #000;

            font-family: "IBM Plex Sans Thai", sans-serif;
            overflow: hidden;
        }

        .coming-soon {
            width: 100%;
            max-width: 900px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 40px 24px;
        }

        /* =========================
           LOGO
           ========================= */

        .logo-wrap {
            margin-bottom: 35px;

            animation: float 5s ease-in-out infinite;
        }

        .logo-wrap img {
            height: 160px;
            width: auto;

            display: block;

            transition: transform 0.5s ease;
        }

        .logo-wrap:hover {
            animation-play-state: paused;
        }

        .logo-wrap:hover img {
            transform: scale(1.1) translateY(-10px);
        }

        /* =========================
           TEXT
           ========================= */

        .coming-soon h1 {
            font-size: 60px;
            font-weight: 700;
            line-height: 1.2;

            margin: 0;
        }

        .bounce-text {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .bounce-text span {
            display: inline-block;

            opacity: 0;

            animation:
                slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                letterBounce 5s ease-in-out infinite;
        }

        /* =========================
           INTRO DELAY
           เลื่อนเข้าจากซ้ายทีละตัว
           ========================= */

        .bounce-text span:nth-child(1)  {
            animation-delay: 0s, 1.60s;
        }

        .bounce-text span:nth-child(2)  {
            animation-delay: 0.08s, 1.64s;
        }

        .bounce-text span:nth-child(3)  {
            animation-delay: 0.16s, 1.68s;
        }

        .bounce-text span:nth-child(4)  {
            animation-delay: 0.24s, 1.72s;
        }

        .bounce-text span:nth-child(5)  {
            animation-delay: 0.32s, 1.76s;
        }

        .bounce-text span:nth-child(6)  {
            animation-delay: 0.40s, 1.80s;
        }

        .bounce-text span:nth-child(7)  {
            animation-delay: 0.48s, 1.84s;
        }

        .bounce-text span:nth-child(8)  {
            animation-delay: 0.56s, 1.88s;
        }

        .bounce-text span:nth-child(9)  {
            animation-delay: 0.64s, 1.92s;
        }

        .bounce-text span:nth-child(10) {
            animation-delay: 0.72s, 1.96s;
        }

        .bounce-text span:nth-child(11) {
            animation-delay: 0.80s, 2.00s;
        }

        .bounce-text span:nth-child(12) {
            animation-delay: 0.88s, 2.04s;
        }

        .bounce-text span:nth-child(13) {
            animation-delay: 0.96s, 2.08s;
        }

        .bounce-text span:nth-child(14) {
            animation-delay: 1.04s, 2.12s;
        }

        .bounce-text span:nth-child(15) {
            animation-delay: 1.12s, 2.16s;
        }

        /* =========================
           INTRO
           ========================= */

        @keyframes slideIn {

            from {
                opacity: 0;
                transform: translateX(80px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        /* =========================
           BOUNCE
           ========================= */

        @keyframes letterBounce {

            0%,
            10%,
            100% {
                transform: translateY(0);
            }

            4% {
                transform: translateY(-14px);
            }

            7% {
                transform: translateY(0);
            }

        }

        /* =========================
           LOGO FLOAT
           ========================= */

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }

        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            .coming-soon {
                padding: 30px 20px;
            }

            .logo-wrap {
                margin-bottom: 28px;
            }

            .logo-wrap img {
                height: 80px;
            }

            .coming-soon h1 {
                font-size: 40px;
            }

        }

        /* =========================
           REDUCED MOTION
           ========================= */

        @media (prefers-reduced-motion: reduce) {

            .logo-wrap {
                animation: none;
            }

            .bounce-text span {
                opacity: 1;
                animation: none;
            }

        }
    </style>
</head>

<body>

    <main class="coming-soon">

        <div class="logo-wrap">
            <img
                src="assets/logo.png"
                alt="พรรคสังคมใหม่"
            >
        </div>

        <h1 class="bounce-text">
            <span>พ</span>
            <span>บ</span>
            <span>กั</span>
            <span>น</span>

            <span>เ</span>
            <span>ร็</span>
            <span>ว</span>
            <span>ๆ</span>

            <span>&nbsp;</span>

            <span>นี้</span>

            <span>!</span>
        </h1>

    </main>

</body>
</html>
